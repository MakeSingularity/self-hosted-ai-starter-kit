# Self-Hosted AI Starter Kit - Project Instructions
# AI Design Bible for maintaining project coherence and onboarding new AIs
# Format: YAML for structured AI consumption with human readability

metadata:
  version: "1.0.0"
  created: "2025-08-18"
  last_updated: "2025-08-18"
  maintained_by: 
    - "Human Lead"
    - "GitHub Copilot"
  file_format: "YAML"
  purpose: "Comprehensive project design bible for AI agents and human developers"
  usage_notes: |
    This file serves as the single source of truth for project architecture,
    component relationships, and implementation standards. All AIs working on
    this project should reference this file to maintain consistency.

# =============================================================================
# PROJECT GOAL & MISSION
# =============================================================================
project_goal:
  mission: "Create a comprehensive self-hosted AI ecosystem for an intelligent workshop assistant with multi-modal sensory capabilities"
  
  vision: |
    Develop a neural network-inspired modular AI system that combines vision, audio, and contextual 
    understanding to assist users in workshop environments through real-time guidance, safety monitoring, 
    and intelligent task coordination.
  
  current_phase:
    name: "Foundation Layer - Voice & Workflow Integration"
    status: "active_development"
    focus_areas:
      - "Telegram voice message transcription via Whisper API"
      - "n8n workflow automation and optimization" 
      - "Oliver AI assistant integration"
      - "Service management and monitoring"
      - "Modular architecture establishment"
  
  success_metrics:
    - "Voice messages transcribed with >90% accuracy"
    - "End-to-end voice-to-response latency <10 seconds"
    - "Text and voice workflows operating without merge node issues"
    - "Automated service health monitoring and recovery"
    - "Modular architecture supporting cross-modal communication"
  
  future_phases:
    - name: "Sensory Expansion Phase"
      description: "Vision processing, object detection, gesture recognition"
      modules: ["vision_processing", "audio_enhancement", "environmental_monitoring"]
    
    - name: "Cognitive Integration Phase" 
      description: "Context fusion, task understanding, safety assessment"
      modules: ["context_awareness", "knowledge_integration", "decision_making"]
    
    - name: "Workshop Intelligence Phase"
      description: "Complete workshop assistant with AR/VR integration"
      modules: ["workspace_analysis", "tool_guidance", "safety_systems"]

