# =============================================================================
# CURRENT IMPLEMENTATION - WORKFLOWS & APPLICATIONS
# =============================================================================
current_workflows:
  voice_processing:
    name: "Oliver Voice Integration"
    description: "Telegram voice message → Whisper transcription → Oliver AI response"
    
    workflow_path:
      - "Telegram Trigger"
      - "Switch Node (Message Type Router)"
      - "Set Nodes (Data Preparation)"
      - "Telegram Get File (Audio Download)"
      - "HTTP Request (Whisper API)"
      - "Function Node (Process Message Content)"
      - "AI Agent (Oliver Response)"
      - "HTTP Request (Send Telegram Reply)"
    
    key_configurations:
      switch_node:
        data_type: "Object"
        property_name: "message"
        rules: ["voice", "audio", "text"]
      
      whisper_api:
        endpoint: "http://host.docker.internal:8000/transcribe/file"
        method: "POST"
        content_type: "multipart/form-data"
        fallback_endpoint: "http://host.docker.internal:8000/transcribe/n8n"
      
      merge_node_issue: |
        CRITICAL: Do not use Merge nodes - they cause text messages to hang.
        Use direct connections to Function nodes instead.
    
    troubleshooting:
      binary_data_access: "Debug with Function node to find correct $binary property name"
      null_transcription: "Verify Set node data capture and HTTP request body formatting"
      text_message_hanging: "Remove Merge nodes, use direct Function node connections"
  
  text_processing:
    name: "Direct Text Processing"
    description: "Telegram text message → Oliver AI response"
    workflow_path:
      - "Telegram Trigger"
      - "Switch Node (Message Type Router)"
      - "Set Node (Prepare Text Data)"
      - "Function Node (Process Message Content)"
      - "AI Agent (Oliver Response)"
      - "HTTP Request (Send Telegram Reply)"

# =============================================================================
# CURRENT APPLICATIONS & SERVICES (Foundation Layer)
# =============================================================================
foundation_applications:
  # Current implementations serving as foundation for modular architecture
  
  n8n:
    module_classification: "workflow_orchestration"
    purpose: 
      - "Workflow automation and inter-module communication"
      - "Event-driven message routing between modules"
      - "API orchestration and data transformation"
    
    current_functions:
      message_routing: "Switch nodes for voice/audio/text classification"
      data_transformation: "Set nodes for standardizing data formats"
      api_integration: "HTTP Request nodes for Whisper and Ollama APIs"
      conditional_logic: "IF nodes for health checking and error handling"
    
    modular_role:
      communication_hub: "Central message bus for module coordination"
      workflow_engine: "Process automation and event handling"
      integration_layer: "Connect external services to modular system"
    
    configuration:
      base_url: "http://localhost:5678"
      docker_container: "n8n"
      data_persistence: "./data/n8n/"
    
    security_constraints:
      child_process_blocked: true
      alternative_solutions: "HTTP Request-based health checking instead of system commands"
    
    known_issues:
      merge_node_hanging: "Text messages hang when using Merge nodes with voice workflows"
      binary_data_access: "Binary property names may vary ($binary.data vs $binary.file)"

  ollama:
    module_classification: "cognitive_processing"
    purpose:
      - "Local LLM hosting for cognitive modules"
      - "Natural language understanding and generation"
      - "Context-aware decision making"
    
    current_functions:
      model_serving: "llama3.1:latest model hosting"
      text_generation: "Generate API for text completion"
      chat_interface: "Chat API for conversational AI"
      context_processing: "Understanding user intent and workshop context"
    
    modular_role:
      language_processing: "Core NLP capabilities for all modules"
      decision_engine: "Reasoning and planning for workshop tasks"
      knowledge_integration: "Combining information from multiple sources"
    
    configuration:
      base_url: "http://ollama:11434"
      model: "llama3.1:latest"
      docker_container: "ollama"
    
    integration:
      n8n_connection: "AI Agent nodes or manual HTTP requests"
      system_prompt: "Oliver AI assistant personality configuration"
      future_expansion: "Multi-modal model support for vision integration"

  whisper_api:
    module_classification: "sensory_input_audio"
    purpose:
      - "Speech-to-text transcription (audio sensory module)"
      - "Audio processing foundation for workshop assistant"
      - "Voice command interpretation"
    
    current_functions:
      file_transcription: "/transcribe/file endpoint for audio file uploads"
      n8n_transcription: "/transcribe/n8n endpoint for Telegram integration"
      health_status: "/status endpoint for service monitoring"
      voice_command_processing: "Convert speech to actionable text"
    
    modular_role:
      audio_input_gateway: "Primary audio sensory input for the system"
      voice_interface: "Enable voice-based workshop guidance"
      ambient_monitoring: "Future: Environmental audio analysis"
    
