    independently while sharing contextual state for intelligent coordination.

  communication_pattern:
    message_bus: "Central event system for inter-module coordination"
    state_sharing: "Distributed context accessible by all modules"
    priority_routing: "Critical safety messages get immediate precedence"
    event_driven: "Modules activate based on input events and context changes"

  # =============================================================================
  # SENSORY INPUT MODULES (Data Acquisition Layer)
  # =============================================================================
  sensory_modules:
    audio_processing:
      current_implementation:
        voice_recognition: "Whisper API via n8n workflows"
        telegram_integration: "Voice message processing"
        text_to_speech: "Planned - Oliver voice responses"
      
